services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-travel}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      UPLOAD_DIR: /app/backend/uploads
      MEDIA_BACKEND: ${MEDIA_BACKEND:-local}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAP_PROVIDER: ${MAP_PROVIDER:-}
      GPS_WEBHOOK_SECRET: ${GPS_WEBHOOK_SECRET:-}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-http://openwa:8033}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_MODE: external
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-Pemilik}
    volumes:
      - uploads:/app/backend/uploads
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "80"

  # WhatsApp (OpenWA, scan QR dari ERP > Integrasi API). Aktif bila COMPOSE_PROFILES=wa di .env.
  openwa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.openwa
    restart: unless-stopped
    profiles: ["wa"]
    depends_on:
      - backend
    environment:
      OPENWA_API_KEY: ${OPENWA_API_KEY:?OPENWA_API_KEY wajib diisi di deploy/.env}
      OPENWA_PORT: "8033"
      OPENWA_SESSION_ID: rahaza
      OPENWA_WEBHOOK: http://backend:8001/api/wa/openwa-webhook
      OPENWA_EXTRA_ARGS: ${OPENWA_EXTRA_ARGS:-}
    volumes:
      - openwa_data:/data
    shm_size: "1gb"
    expose:
      - "8033"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "api_key: ${OPENWA_API_KEY:-}", "http://127.0.0.1:8033/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile.generated:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  uploads:
  openwa_data:
  caddy_data:
  caddy_config:
