        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
        <!-- Override: sembunyikan & hapus badge "Made with Emergent" (di-inject di level proxy) -->
        <style>#emergent-badge{opacity:0!important;visibility:hidden!important;pointer-events:none!important;display:none!important}</style>
        <script>
            (function () {
                function killBadge() {
                    var nodes = document.querySelectorAll("#emergent-badge");
                    for (var i = 0; i < nodes.length; i++) {
                        try { nodes[i].remove(); } catch (e) {}
                    }
                }
                killBadge();
                document.addEventListener("DOMContentLoaded", killBadge);
                window.addEventListener("load", killBadge);
                try {
                    var mo = new MutationObserver(killBadge);
                    mo.observe(document.documentElement, { childList: true, subtree: true });
                } catch (e) {}
            })();
        </script>
